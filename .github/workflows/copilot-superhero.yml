name: 🦸‍♂️ Copilot Superhero Workflow

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly maintenance

permissions:
  # Grant maximum permissions for Copilot superhero capabilities
  actions: write          # Manage GitHub Actions
  checks: write           # Create and update status checks
  contents: write         # Read and write repository contents
  deployments: write      # Create deployments
  discussions: write      # Manage discussions
  id-token: write        # Generate OIDC tokens
  issues: write          # Manage issues
  packages: write        # Publish and manage packages
  pages: write          # Manage GitHub Pages
  pull-requests: write   # Manage pull requests
  repository-projects: write  # Manage repository projects
  security-events: write # Write security events
  statuses: write       # Create commit statuses

jobs:
  copilot-health-check:
    name: 🔍 Copilot Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Validate Repository Structure
        run: |
          echo "🔍 Checking repository structure..."
          ls -la
          echo "✅ Main files present"
          
      - name: Test Application Deployment
        run: |
          echo "🚀 Testing Python HTTP server..."
          python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:8000 > /dev/null && echo "✅ Python server works"
          kill $SERVER_PID
          
          echo "🚀 Testing Node.js HTTP server..."
          npx http-server -p 8001 &
          NODE_PID=$!
          sleep 3
          curl -f http://localhost:8001 > /dev/null && echo "✅ Node.js server works"
          kill $NODE_PID
          
      - name: Code Quality Check
        run: |
          echo "🧹 Running basic code quality checks..."
          # Check for syntax errors in JavaScript files
          for js_file in *.js; do
            if [ -f "$js_file" ]; then
              node -c "$js_file" && echo "✅ $js_file syntax OK"
            fi
          done
          
          # Check HTML validity (basic)
          for html_file in *.html; do
            if [ -f "$html_file" ]; then
              echo "✅ $html_file found"
            fi
          done

  copilot-automation:
    name: 🤖 Copilot Automation Tasks
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Auto-label Issues
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          echo "🏷️ Auto-labeling new issue #${{ github.event.issue.number }}"
          # Add enhancement label for feature requests
          if echo "${{ github.event.issue.title }}" | grep -i "feature\|add\|implement"; then
            gh issue edit ${{ github.event.issue.number }} --add-label "enhancement"
          fi
          
          # Add bug label for bug reports
          if echo "${{ github.event.issue.title }}" | grep -i "bug\|error\|fix\|broken"; then
            gh issue edit ${{ github.event.issue.number }} --add-label "bug"
          fi
          
          # Add copilot label for copilot-related issues
          if echo "${{ github.event.issue.title }}" | grep -i "copilot\|@copilot"; then
            gh issue edit ${{ github.event.issue.number }} --add-label "copilot"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-updates:
    name: 🔄 Dependency & Security Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update Documentation
        run: |
          echo "📚 Checking documentation updates..."
          current_date=$(date +"%Y-%m-%d")
          
          # Update README with last automated check
          if [ -f "README.md" ]; then
            echo "" >> README.md
            echo "---" >> README.md
            echo "*Last automated health check: $current_date*" >> README.md
          fi
          
      - name: Commit Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Copilot Superhero Bot"
          
          if git diff --staged --quiet; then
            git add .
            if ! git diff --staged --quiet; then
              git commit -m "🤖 Automated updates by Copilot Superhero"
              git push
            fi
          fi

  deploy-preview:
    name: 🚀 Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to GitHub Pages (Preview)
        run: |
          echo "🚀 Would deploy preview for PR #${{ github.event.pull_request.number }}"
          echo "Preview URL would be: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}"
          
      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deploy Ready!**
              
              Your changes have been deployed to a preview environment.
              
              **Preview URL:** \`https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}\`
              
              _This preview will be available until the PR is merged or closed._`
            });